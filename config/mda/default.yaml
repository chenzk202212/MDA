# Parameter-space alignment.
k: null # Retention fraction: null automatically uses 1 / actual merged task count.
dimension: 2400 # ETF reference class dimension, NOT the encoder feature width.
parameter_alpha: 1.0 # Blend: (1-alpha)*reconstruction + alpha*ETF projection.

# Feature-space alignment and optimization.
lambda_init: 1.0
alignment_alpha: 1.0
assignment_temperature: 1.0 # Positive cosine soft-assignment temperature (gamma).
alignment_warmup_epochs: 0
rotation_weight: 0.0 # Multiplied by the current alignment_alpha.
lr: 0.001
betas: [0.9, 0.999]
weight_decay: 0.0
epochs: 1000
batch_size: 16
prototype_batch_size: 4
eval_interval: 500
resume: null # Path to an alignment checkpoint; use the same model/task config.
